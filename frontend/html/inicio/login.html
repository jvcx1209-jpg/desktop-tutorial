<html>

<head>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
  <link rel="icon" href="../../imagens/inicio/logos/loguinho-aacd-barra.png">
  <title>Login | AACD</title>
</head>


<body>
  <link rel="stylesheet" href="../../css/inicio/login.css">
  <div class="background">
    <div class="login">
      <div class="logos">
        <img class="logoAacd" src="../../imagens/inicio/logos/logo-aacd.webp" alt="Logo da AACD">
        <span class="divisor"></span>
        <img src="../../imagens/inicio/logos/logo-maua.svg" alt="Logo Maua Figma">
      </div>

      <h1 style="
    font-family: 'Sora' , sans-senrif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -1; 
    ">
        Acesso Institucional
      </h1>

      <p style="
    font-family: 'Sora' , sans-senrif;
    font-size: 15px;
    font-weight: 70;
    letter-spacing: -1; 
    ">
        Por favor, coloque seus dados abaixo:
      </p>

      <div class="campoComIcone">
        <img class="iconeCampo" src="../../imagens/inicio/icones/icone-email.svg" alt="">

        <input class="campoLogin" type="email" placeholder="E-mail">
      </div>

      <div class="campoComIcone">
        <img class="iconeCampo" src="../../imagens/inicio/icones/icone-cadeado.svg" alt="">

        <input class="campoLogin" type="password" placeholder="Senha">

        <button class="botaoOlho" type="button">
          <img src="../../imagens/inicio/icones/icone-olho.svg" alt="Mostrar senha">
        </button>
      </div>

      <div class="botoes">
        <button class="botaoEntrar" type="button">Entrar</button>

        <div class="opcoesLogin">
          <label class="lembrarAcesso"> <input type="checkbox">
            <span> Lembrar meu acesso</span>
          </label>
          <a class="linkCadastro" href="cadastro.html">Não Possui conta?</a>


          <div class="esqueceuSenha">
            <a class="esqueceuSenhaBotao" href="esqueciSenha.html">
              Esqueceu a senha?
            </a>
          </div>
        </div>


      </div>


    </div>

</body>


</html>
