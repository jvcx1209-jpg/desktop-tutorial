<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | AACD</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="../../css/inicio/esqueciSenha.css">
    <link rel="icon" href="../../imagens/inicio/logos/loguinho-aacd-barra.png">
</head>

<body>
    <div class="background">
        <div class="border" aria-labelledby="tituloRecuperarSenha">
            <div class="logos">
                <img class="logoAacd" src="../../imagens/inicio/logos/logo-aacd.webp" alt="Logo da AACD">
                <span class="divisor" aria-hidden="true"></span>
                <img src="../../imagens/inicio/logos/logo-maua.svg" alt="Logo do Instituto Mauá de Tecnologia">
            </div>

            <h1 id="tituloRecuperarSenha">Recuperar senha</h1>
            <p>Informe seu e-mail para receber as instruções de recuperação.</p>

            <div class="campoComIcone">
                <img class="iconeCampo" src="../../imagens/inicio/icones/icone-email.svg" alt="">
                <input class="campoRecuperacao" type="email" name="email" placeholder="E-mail" autocomplete="email">
            </div>

            <div class="botoes">
                <button class="botaoEnviar" type="button">Enviar link de recuperação</button>
                <a class="linkLogin" href="login.html">Voltar ao login</a>
            </div>
        </div>
    </div>
</body>

</html>
