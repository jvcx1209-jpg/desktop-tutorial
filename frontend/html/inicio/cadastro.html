<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | AACD</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="../../css/inicio/cadastro.css">
    <link rel="icon" href="../../imagens/inicio/logos/loguinho-aacd-barra.png">
</head>




<body>

    <div class="background">
        <div class="border" aria-labelledby="tituloCadastro">
            <div class="logos">
                <img class="logoAacd" src="../../imagens/inicio/logos/logo-aacd.webp" alt="Logo da AACD">
                <span class="divisor" aria-hidden="true"></span>
                <img src="../../imagens/inicio/logos/logo-maua.svg" alt="Logo do Instituto Mauá de Tecnologia">
            </div>

            <h1 id="tituloCadastro">Acesso Institucional</h1>
            <p>Por favor, cadastre seus dados abaixo:</p>

            <div class="campoComIcone">
                <img class="iconeCampo" src="../../imagens/inicio/icones/icone-nome.svg" alt="Icone campo">
                <input class="campoLogin" type="text" name="nome" placeholder="Nome" autocomplete="name">
            </div>

            <div class="campoComIcone">
                <img class="iconeCampo" src="../../imagens/inicio/icones/icone-email.svg" alt="">
                <input class="campoLogin" type="email" name="email" placeholder="E-mail" autocomplete="email">
            </div>


            <div class="campoComIcone">
                <img class="iconeCampo" src="../../imagens/inicio/icones/icone-cadeado.svg" alt="">
                <input class="campoLogin" type="password" name="senha" placeholder="Senha" autocomplete="new-password">
                <button class="botaoOlho" type="button" aria-label="Mostrar senha">
                    <img src="../../imagens/inicio/icones/icone-olho.svg" alt="">
                </button>
            </div>


            <div class="campoComIcone">
                <img class="iconeCampo" src="../../imagens/inicio/icones/icone-cadeado.svg" alt="">
                <input class="campoLogin" type="password" name="confirmarSenha" placeholder="Confirmar senha"
                    autocomplete="new-password">
                <button class="botaoOlho" type="button" aria-label="Mostrar confirmação de senha">
                    <img src="../../imagens/inicio/icones/icone-olho.svg" alt="">
                </button>
            </div>


            <div class="botoes">
                <button class="botaoCadastrar" type="button">Cadastrar</button>
                <a class="linkLogin" href="login.html">Já tenho uma conta</a>
            </div>

        </div>
    </div>
</body>

</html>
